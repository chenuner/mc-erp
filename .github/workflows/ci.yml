name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  backend:
    name: Backend Build and Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore backend/MC.Erp.csproj

      - name: Build backend
        # OCR 憑據只在執行期讀取；CI 目前只建置不呼叫 Azure，這裡先映射好，
        # 日後在本步之後加識別整合檢查時可直接使用。未配置 secret 時為空字串，不影響建置。
        env:
          AZURE_DOC_ENDPOINT: ${{ secrets.AZURE_DOC_ENDPOINT }}
          AZURE_DOC_KEY: ${{ secrets.AZURE_DOC_KEY }}
        run: dotnet build backend/MC.Erp.csproj --configuration Release --no-restore

      - name: Publish backend
        run: dotnet publish backend/MC.Erp.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/publish-backend"

      - name: Upload backend
        uses: actions/upload-artifact@v6
        with:
          name: backend
          path: ${{ runner.temp }}/publish-backend/
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend Build and Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          # package.json 在 frontend/ 下；action 默認只讀倉庫根目錄
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm exec vite build

      - name: Upload frontend
        uses: actions/upload-artifact@v6
        with:
          name: frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  images:
    name: Build and Save Images
    needs: [backend, frontend]
    # 镜像只在要部署时才需要，PR 只验证代码能编译
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download backend
        uses: actions/download-artifact@v7
        with:
          name: backend
          path: images/backend/publish

      - name: Download frontend
        uses: actions/download-artifact@v7
        with:
          name: frontend
          path: images/frontend/dist

      # 在 runner 上构建：2 核服务器不再 build / 拉基础镜像，只负责 docker load
      - name: Build backend image
        timeout-minutes: 8
        run: |
          cp backend/Dockerfile images/backend/
          docker build --tag mc-erp-backend:latest images/backend

      - name: Build frontend image
        timeout-minutes: 5
        run: |
          cp frontend/Dockerfile frontend/nginx.conf images/frontend/
          docker build --tag mc-erp-web:latest images/frontend

      # 两个镜像打成一个 gzip 包：服务器只需一次 scp、一次 load
      - name: Save images
        timeout-minutes: 8
        run: |
          set -euo pipefail
          docker save mc-erp-backend:latest mc-erp-web:latest | gzip -1 > mc-erp-images.tar.gz
          ls -lh mc-erp-images.tar.gz

      - name: Upload images
        uses: actions/upload-artifact@v6
        with:
          name: images
          path: mc-erp-images.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy Production
    # 镜像 job 已包含 backend / frontend 的构建，这里只等镜像
    needs: [images]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # 外层安全网，不是预期耗时：远端脚本自己会在约 16 分钟内收尾（SSH 硬断）。
    timeout-minutes: 30
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download images
        uses: actions/download-artifact@v7
        with:
          name: images
          path: deploy-images

      - name: Package release
        run: |
          mkdir -p release
          cp docker-compose.prod.yml release/
          bash -n deploy/bootstrap.sh
          bash -n deploy/deploy.sh
          tar -czf release.tar.gz -C release .

      # 密钥文件保留到 job 结束，失败时兜底清理步骤还要用它登录
      - name: Prepare SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?Set repository secret DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set repository secret DEPLOY_KNOWN_HOSTS}"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy_known_hosts"

      - name: Upload and start services
        id: deploy
        # 必须小于 job 超时，才能给下面的兜底清理留出执行机会
        timeout-minutes: 18
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set repository variable DEPLOY_HOST}"
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/deploy_known_hosts"
          options=(-i "$key" -o "UserKnownHostsFile=$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          # scp / ssh 本身也有硬逾时：网络黑洞或远端不响应时 runner 不会无限等待
          timeout --kill-after=15s 120s scp "${options[@]}" -P "$DEPLOY_PORT" release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/mc-erp/release.tar.gz"
          timeout --kill-after=15s 600s scp "${options[@]}" -P "$DEPLOY_PORT" deploy-images/mc-erp-images.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/mc-erp/mc-erp-images.tar.gz"
          timeout --kill-after=30s 960s ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- deploy" < deploy/deploy.sh

      # 部署步骤失败/超时后，远端可能还留着卡住的 compose 进程和临时镜像包；
      # cleanup 模式只杀进程、清缓存、删临时文件，不会停止正在运行的服务。
      - name: Cleanup remote after failure
        if: always() && (steps.deploy.outcome == 'failure' || steps.deploy.outcome == 'cancelled')
        timeout-minutes: 5
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/deploy_known_hosts"
          if [[ ! -f "$key" || -z "${DEPLOY_HOST:-}" ]]; then
            echo "No SSH key or DEPLOY_HOST, skipping remote cleanup."
            exit 0
          fi
          options=(-i "$key" -o "UserKnownHostsFile=$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          timeout --kill-after=15s 240s ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- cleanup" < deploy/deploy.sh || true

      - name: Remove SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"
