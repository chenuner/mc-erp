name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  backend:
    name: Backend Build and Package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore backend/MC.Erp.csproj

      - name: Build backend
        run: dotnet build backend/MC.Erp.csproj --configuration Release --no-restore

      - name: Publish backend
        run: dotnet publish backend/MC.Erp.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/publish-backend"

      - name: Upload backend
        uses: actions/upload-artifact@v6
        with:
          name: backend
          path: ${{ runner.temp }}/publish-backend/
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend Build and Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          # package.json 在 frontend/ 下；action 默認只讀倉庫根目錄
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm exec vite build

      - name: Upload frontend
        uses: actions/upload-artifact@v6
        with:
          name: frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  images:
    name: Build Images
    needs: [backend, frontend]
    # 镜像只在要部署时才需要，PR 只验证代码能编译
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download backend
        uses: actions/download-artifact@v7
        with:
          name: backend
          path: images/backend/publish

      - name: Download frontend
        uses: actions/download-artifact@v7
        with:
          name: frontend
          path: images/frontend/dist

      # 在 runner 上构建，服务器只负责 docker load；2 核小机器不再需要编译
      - name: Build backend image
        run: |
          cp backend/Dockerfile images/backend/
          docker build --tag mc-erp-backend:latest images/backend

      - name: Build frontend image
        run: |
          cp frontend/Dockerfile frontend/nginx.conf images/frontend/
          docker build --tag mc-erp-web:latest images/frontend

      - name: Save images
        run: |
          docker save mc-erp-backend:latest > mc-erp-backend.tar
          docker save mc-erp-web:latest > mc-erp-web.tar
          ls -lh mc-erp-*.tar

      - name: Upload images
        uses: actions/upload-artifact@v6
        with:
          name: images
          path: mc-erp-*.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy Production
    # 需要镜像 job：服务器不自己 build，只 docker load CI 产出的镜像
    needs: [backend, frontend, images]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download backend
        uses: actions/download-artifact@v7
        with:
          name: backend
          path: release/backend/publish

      - name: Download frontend
        uses: actions/download-artifact@v7
        with:
          name: frontend
          path: release/frontend/dist

      - name: Download images
        uses: actions/download-artifact@v7
        with:
          name: images
          path: release/images

      - name: Package release
        run: |
          cp docker-compose.prod.yml release/
          bash -n deploy/bootstrap.sh
          bash -n deploy/deploy.sh
          tar -czf release.tar.gz -C release .

      - name: Upload and start services
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set repository variable DEPLOY_HOST}"
          : "${DEPLOY_SSH_KEY:?Set repository secret DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set repository secret DEPLOY_KNOWN_HOSTS}"
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/deploy_known_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          options=(-i "$key" -o "UserKnownHostsFile=$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)
          scp "${options[@]}" -P "$DEPLOY_PORT" release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/mc-erp/release.tar.gz"
          scp "${options[@]}" -P "$DEPLOY_PORT" release/images/mc-erp-backend.tar release/images/mc-erp-web.tar "$DEPLOY_USER@$DEPLOY_HOST:/opt/mc-erp/"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" < deploy/deploy.sh