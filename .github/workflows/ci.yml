name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  backend:
    name: Backend Build and Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mc_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mc_erp_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ConnectionStrings__Default: Host=localhost;Port=5432;Database=mc_erp_ci;Username=postgres;Password=ci-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore backend
        run: dotnet restore backend/MC.Erp.slnx

      - name: Build backend
        run: dotnet build backend/MC.Erp.slnx --configuration Release --no-restore

      - name: Run identity checks
        run: dotnet run --project tests/Identity.Checks/Identity.Checks.csproj --configuration Release

      - name: Run accounting and integration checks
        run: dotnet run --project tests/Accounting.Checks/Accounting.Checks.csproj --configuration Release -- --integration

      - name: Publish backend
        run: dotnet publish backend/MC.Erp.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/publish-backend"

      - name: Upload backend
        uses: actions/upload-artifact@v6
        with:
          name: backend
          path: ${{ runner.temp }}/publish-backend/
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend Type Check and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and build frontend
        run: pnpm run build

      - name: Upload frontend
        uses: actions/upload-artifact@v6
        with:
          name: frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Production
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download backend
        uses: actions/download-artifact@v7
        with:
          name: backend
          path: release/backend/publish

      - name: Download frontend
        uses: actions/download-artifact@v7
        with:
          name: frontend
          path: release/frontend/dist

      - name: Package release
        run: |
          cp backend/Dockerfile release/backend/
          cp frontend/Dockerfile frontend/nginx.conf release/frontend/
          cp docker-compose.prod.yml release/
          bash -n deploy/bootstrap.sh
          bash -n deploy/deploy.sh
          tar -czf release.tar.gz -C release .

      - name: Upload and start services
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set repository variable DEPLOY_HOST}"
          : "${DEPLOY_SSH_KEY:?Set repository secret DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Set repository secret DEPLOY_KNOWN_HOSTS}"
          key="$RUNNER_TEMP/deploy_key"
          hosts="$RUNNER_TEMP/deploy_known_hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          options=(-i "$key" -o "UserKnownHostsFile=$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20)
          scp "${options[@]}" -P "$DEPLOY_PORT" release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/mc-erp/release.tar.gz"
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" < deploy/deploy.sh