user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	#worker_connections 768;
	worker_connections 1024;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	# 以上均为nginx.conf文件的默认配置，不需要更改，直接在下面添加即可
    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    # 将服务所有的 http 请求转换为 https 请求
	# server {
    # 	listen    80;
    #     #你的域名，请不要带有http://或者https://
    # 	# server_name  msucce.com www.msucce.com mskyrich.com www.mskyrich.com xsgnn.com www.xsgnn.com;
    # 	server_name  msucce.com www.msucce.com;
    #     # 将所有 HTTP 请求重定向到 HTTPS
    #     return 301 https://$host$request_uri;
    # }

    # 26/02/26将所有 HTTP 请求重定向到 www.msucce.com HTTPS
    server {
    	listen 80;
    	server_name msucce.com www.msucce.com;
    	# Allow ACME http-01 challenge
	location /.well-known/acme-challenge/ {
	    root /var/www/acme-challenge;
	}

	location / {
	    return 301 https://www.msucce.com$request_uri;
	}
    }

    # ERP：先用公网 IP 验收；IP 没有对应 server_name，落到 default server
    # 之后再挂域名，在这里加 server_name 和 443 即可，不用动官网
    server {
        listen 80 default_server;
        server_name _;

        # 票据上传单张 4MB；默认 1m 会 413
        client_max_body_size 20m;

        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 10s;
            proxy_send_timeout 180s;
            # OCR 最长 60s、票据 ZIP 打包上限 250MB；默认 60s 会断线
            proxy_read_timeout 180s;
        }
    }

    #前台页面;
    server {
        listen 443   ssl;
        server_name  msucce.com www.msucce.com;
        #ssl on; #设置为on启用SSL功能。如果使用listen 443 ssl，删除ssl on就行了。

        ssl_certificate /etc/nginx/ssl/msucce.com/fullchain.cer; #将domainname.pem替换成您证书的文件名。
        ssl_certificate_key /etc/nginx/ssl/msucce.com/msucce.com.key; #将domainname.key替换成您证书的密钥文件名。
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;                  #设置SSL会话超时时间为5分钟
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2; #使用该协议进行配置。
        ssl_prefer_server_ciphers on; #使用服务器端的加密算法。
        #ssl_verify_client optional; #客户端验证，可选。

        location / {
        if ($http_host ~* "(^msucce.com$|^www.msucce.com$)") {
            root /var/www/dist;
        }

            index index.html index.htm;
        }


        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    # Other SSL-related configurations
    }

}
