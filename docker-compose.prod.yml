name: mc-erp-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mc_erp
      POSTGRES_USER: mc_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc_erp -d mc_erp"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: mc-erp-backend:latest
    build: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: '8080'
      ConnectionStrings__Default: Host=postgres;Database=mc_erp;Username=mc_erp;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET:?Set JWT_SECRET}
      Bootstrap__AdminPassword: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD}
      Storage__RootPath: /app/storage-files
      Ocr__Endpoint: ${OCR_ENDPOINT:-}
      Ocr__Key: ${OCR_KEY:-}
    volumes:
      - storage:/app/storage-files
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  web:
    image: mc-erp-web:latest
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  storage:
  logs: