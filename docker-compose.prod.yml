name: mc-erp-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mc_erp
      POSTGRES_USER: mc_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mc_erp -d mc_erp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    # 镜像由 GitHub Actions 构建后 docker save 上传，服务器只 docker load，不在这里 build
    image: mc-erp-backend:latest
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: '8080'
      ConnectionStrings__Default: Host=postgres;Database=mc_erp;Username=mc_erp;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__SecretKey: ${JWT_SECRET:?Set JWT_SECRET}
      Bootstrap__AdminPassword: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD}
      Storage__RootPath: /app/storage-files
      Ocr__Endpoint: ${OCR_ENDPOINT:-}
      Ocr__Key: ${OCR_KEY:-}
    volumes:
      - storage:/app/storage-files
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 用 127.0.0.1 而不是 localhost：容器內 localhost 可能先解析到 ::1。
      # 首次啟動要跑 EF 遷移和種子資料，慢機器上可能超過 3 分鐘，所以預算放寬到 8 分鐘。
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "8", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s

  web:
    # 同上：镜像由 CI 构建并上传
    image: mc-erp-web:latest
    restart: unless-stopped
    ports:
      # 只綁本機回環，由宿主機 nginx 統一對外；不佔用 80/443
      - '127.0.0.1:8080:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 容器內 nginx 監聽 80；8080 只是宿主機的映射端口，不要在容器內用 8080。
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
  storage:
  logs: