services:
  postgres:
    image: postgres:16-alpine
    container_name: mc-erp-db
    environment:
      POSTGRES_DB: mc_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"  # 宿主机 5432 被本機 PostgreSQL 18 服務佔用，改用 5433
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
